name: engineering-kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.1, pinned to its commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check task records and handoffs
        run: python3 .engineering-kit/kit/tools/kit.py check
      - name: Scan tracked files for credentials
        run: python3 .engineering-kit/kit/tools/kit.py scan-secrets
