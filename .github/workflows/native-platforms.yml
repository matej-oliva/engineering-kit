name: Native platform verification

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Release candidate X.Y.Z to rehearse before tagging; empty tests the two newest tags'
        required: false
        default: ''

permissions:
  contents: read

# A newer run on the same branch and candidate replaces one still running.
concurrency:
  group: native-${{ github.ref }}-${{ inputs.candidate }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Suite
        # --durations needs Python 3.12; the slowest tests show where native time goes.
        run: python -m unittest discover -s tests -v ${{ matrix.python != '3.11' && '--durations 20' || '' }}
      - name: Release lifecycle
        if: ${{ !cancelled() }}
        env:
          KIT_CANDIDATE: ${{ inputs.candidate }}
        run: python tests/native_release.py --source . --report "${{ runner.temp }}/native-report.json"
      - name: Retain platform evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-python-${{ matrix.python }}
          path: ${{ runner.temp }}/native-report.json
          if-no-files-found: error
          retention-days: 30
