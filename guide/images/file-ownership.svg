<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Who owns which file</title>
  <desc id="desc">Three columns. The kit owns everything under .engineering-kit/kit/, the marked block in each instruction file and the files its granted integrations install; releases update these and merge your changes. The project owns .engineering-kit/project.json, the task and handoff folders and all text outside the marked block; the kit never changes them. The tool keeps .engineering-kit/lock.json, which records the installed release, and a journal that exists only while an apply runs.</desc>
  <rect width="960" height="380" fill="#ffffff"/>
  <g font-size="15" fill="#111827">
    <rect x="20" y="20" width="290" height="340" rx="12" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="165" y="52" text-anchor="middle" font-size="19" font-weight="bold">The kit owns</text>
    <text x="165" y="76" text-anchor="middle" font-size="13">releases update these</text>
    <text x="40" y="118" font-family="Menlo, Consolas, monospace" font-size="14">.engineering-kit/kit/</text>
    <text x="52" y="140" font-size="13">contract, procedures, guide, tools</text>
    <text x="40" y="182">the marked block in</text>
    <text x="40" y="202" font-family="Menlo, Consolas, monospace" font-size="14">AGENTS.md</text>
    <text x="52" y="224" font-size="13">and other instruction files</text>
    <text x="40" y="266">integration files</text>
    <text x="52" y="288" font-size="13">the kit command, skills,</text>
    <text x="52" y="308" font-size="13">review templates</text>
    <text x="40" y="342" font-size="13" font-style="italic">your edits are merged at updates</text>

    <rect x="335" y="20" width="290" height="340" rx="12" fill="#e3f5e8" stroke="#15803d" stroke-width="2"/>
    <text x="480" y="52" text-anchor="middle" font-size="19" font-weight="bold">The project owns</text>
    <text x="480" y="76" text-anchor="middle" font-size="13">the kit never changes these</text>
    <text x="355" y="118" font-family="Menlo, Consolas, monospace" font-size="14">.engineering-kit/project.json</text>
    <text x="367" y="140" font-size="13">checks, profiles, authority, rules</text>
    <text x="355" y="182">task records and handoffs</text>
    <text x="367" y="204" font-size="13">in the folders project.json names</text>
    <text x="355" y="246">all text outside the block</text>
    <text x="367" y="268" font-size="13">in your instruction files</text>
    <text x="355" y="310">your code and documentation</text>
    <text x="355" y="342" font-size="13" font-style="italic">kept even when the kit is removed</text>

    <rect x="650" y="20" width="290" height="340" rx="12" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
    <text x="795" y="52" text-anchor="middle" font-size="19" font-weight="bold">The tool keeps</text>
    <text x="795" y="76" text-anchor="middle" font-size="13">do not edit by hand</text>
    <text x="670" y="118" font-family="Menlo, Consolas, monospace" font-size="14">.engineering-kit/lock.json</text>
    <text x="682" y="140" font-size="13">the installed release, its source</text>
    <text x="682" y="160" font-size="13">and the digest of every file written</text>
    <text x="670" y="202" font-family="Menlo, Consolas, monospace" font-size="14">.engineering-kit/journal/</text>
    <text x="682" y="224" font-size="13">only while an apply runs;</text>
    <text x="682" y="244" font-size="13">recover uses it after</text>
    <text x="682" y="264" font-size="13">an interruption</text>
    <text x="670" y="342" font-size="13" font-style="italic">commit lock.json, never the journal</text>
  </g>
</svg>
