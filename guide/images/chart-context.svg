<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 274" width="900" height="274" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">What an agent reads, and when</title>
  <desc id="desc">Horizontal bars in bytes: entry block, read in every session: 473 bytes; contract, read to plan, review or release: 6875 bytes; one procedure, on average, read for its stage: 2179 bytes; all skill metadata, before client invocation filtering: 3225 bytes.</desc>
  <rect width="900" height="274" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" text-anchor="start" fill="#111827" font-weight="bold">What an agent reads, and when</text>
  <text x="348" y="80" font-size="13" text-anchor="end" fill="#111827" font-weight="normal">entry block, read in every session</text>
  <rect x="360" y="64" width="28.9" height="24" fill="#1d4ed8"/>
  <text x="396.896" y="81" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">473 bytes</text>
  <text x="348" y="126" font-size="13" text-anchor="end" fill="#111827" font-weight="normal">contract, read to plan, review or release</text>
  <rect x="360" y="110" width="420.0" height="24" fill="#1d4ed8"/>
  <text x="788.0" y="127" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">6 875 bytes</text>
  <text x="348" y="172" font-size="13" text-anchor="end" fill="#111827" font-weight="normal">one procedure, on average, read for its stage</text>
  <rect x="360" y="156" width="133.1" height="24" fill="#1d4ed8"/>
  <text x="501.1170909090909" y="173" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">2 179 bytes</text>
  <text x="348" y="218" font-size="13" text-anchor="end" fill="#111827" font-weight="normal">all skill metadata, before client invocation filtering</text>
  <rect x="360" y="202" width="197.0" height="24" fill="#1d4ed8"/>
  <text x="565.0181818181818" y="219" font-size="13" text-anchor="start" fill="#111827" font-weight="normal">3 225 bytes</text>
</svg>
