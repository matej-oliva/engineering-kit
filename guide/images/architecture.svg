<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Architecture of the kit</title>
  <desc id="desc">Left: the kit's source repository publishes release tags; each tag holds RELEASE.json, the manifest of every installed file with its SHA-256 digest. Middle: adopting or updating fetches one tag into a temporary repository and verifies it against its manifest. Right: inside the project, the updater writes the kit under .engineering-kit/kit/, the files of granted integrations, and the entry block in each instruction file, and records the release and digests in lock.json. The checker reads project.json, the task records and the handoffs, and refuses records that claim more than their evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect x="20" y="40" width="230" height="250" rx="12" fill="#f3f6fb" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="66" font-weight="bold" font-size="16">Kit repository</text>
    <rect x="40" y="84" width="190" height="56" rx="8" fill="#ffffff" stroke="#1d4ed8"/>
    <text x="135" y="108">contract, procedures,</text>
    <text x="135" y="126">guide, tools, integrations</text>
    <rect x="40" y="160" width="190" height="110" rx="8" fill="#e0ecff" stroke="#1d4ed8"/>
    <text x="135" y="186" font-weight="bold">Release tag vX.Y.Z</text>
    <text x="135" y="210" font-size="13" font-family="Menlo, Consolas, monospace">RELEASE.json</text>
    <text x="135" y="230" font-size="12">every file and its</text>
    <text x="135" y="248" font-size="12">SHA-256 digest</text>

    <rect x="300" y="150" width="190" height="130" rx="12" fill="#fff4d6" stroke="#b45309" stroke-width="2"/>
    <text x="395" y="178" font-weight="bold">Updater</text>
    <text x="395" y="200" font-size="12">fetches one tag into a</text>
    <text x="395" y="218" font-size="12">temporary repository,</text>
    <text x="395" y="236" font-size="12">verifies every digest,</text>
    <text x="395" y="254" font-size="12">previews, then applies</text>

    <rect x="540" y="20" width="400" height="400" rx="12" fill="#f6f8f6" stroke="#15803d" stroke-width="2"/>
    <text x="740" y="46" font-weight="bold" font-size="16">Your project</text>
    <rect x="560" y="62" width="360" height="56" rx="8" fill="#e0ecff" stroke="#1d4ed8"/>
    <text x="740" y="86" font-size="13" font-family="Menlo, Consolas, monospace">.engineering-kit/kit/</text>
    <text x="740" y="106" font-size="12">the installed release, including this guide</text>
    <rect x="560" y="128" width="175" height="62" rx="8" fill="#e0ecff" stroke="#1d4ed8"/>
    <text x="647" y="152" font-size="12">integration files</text>
    <text x="647" y="172" font-size="12">kit command, skills</text>
    <rect x="745" y="128" width="175" height="62" rx="8" fill="#e0ecff" stroke="#1d4ed8"/>
    <text x="832" y="152" font-size="12">entry block in</text>
    <text x="832" y="172" font-size="12" font-family="Menlo, Consolas, monospace">AGENTS.md</text>
    <rect x="560" y="200" width="360" height="50" rx="8" fill="#eef2f7" stroke="#4b5563"/>
    <text x="740" y="222" font-size="13" font-family="Menlo, Consolas, monospace">.engineering-kit/lock.json</text>
    <text x="740" y="240" font-size="12">release, source and every digest written</text>
    <rect x="560" y="270" width="175" height="62" rx="8" fill="#e3f5e8" stroke="#15803d"/>
    <text x="647" y="294" font-size="12" font-family="Menlo, Consolas, monospace">project.json</text>
    <text x="647" y="314" font-size="12">your facts and rules</text>
    <rect x="745" y="270" width="175" height="62" rx="8" fill="#e3f5e8" stroke="#15803d"/>
    <text x="832" y="294" font-size="12">tasks and handoffs</text>
    <text x="832" y="314" font-size="12">your records</text>
    <rect x="560" y="350" width="360" height="54" rx="8" fill="#fde2e2" stroke="#b91c1c"/>
    <text x="740" y="374" font-weight="bold">Checker</text>
    <text x="740" y="394" font-size="12">reads your configuration and records; runs nothing</text>
  </g>
  <g stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="135" y1="140" x2="135" y2="158"/>
    <line x1="230" y1="215" x2="298" y2="215"/>
    <path d="M490,200 C520,200 520,90 558,90"/>
    <path d="M490,215 C525,215 525,160 558,160"/>
    <path d="M490,230 C530,230 530,225 558,225"/>
    <line x1="647" y1="332" x2="647" y2="348"/>
    <line x1="832" y1="332" x2="832" y2="348"/>
  </g>
  <g font-size="12" fill="#111827">
    <text x="236" y="206">publishes</text>
  </g>
</svg>
