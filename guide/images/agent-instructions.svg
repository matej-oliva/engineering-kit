<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">How an agent finds its instructions</title>
  <desc id="desc">The agent starts by reading its usual instruction file, such as AGENTS.md. The kit's entry block points to the contract and project.json. Thirteen procedures include twelve automatically selected skills and an interview invoked explicitly by name. Each skill points to its procedure. Where project rules and kit rules differ, the stricter applies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <g font-size="15" fill="#111827" text-anchor="middle">
    <rect x="20" y="170" width="150" height="70" rx="10" fill="#fff4d6" stroke="#b45309" stroke-width="2"/>
    <text x="95" y="200" font-weight="bold">The agent</text>
    <text x="95" y="222" font-size="13">starts a session</text>

    <rect x="210" y="150" width="210" height="110" rx="10" fill="#eef2f7" stroke="#4b5563" stroke-width="2"/>
    <text x="315" y="176" font-weight="bold">Its instruction file</text>
    <text x="315" y="196" font-size="13" font-family="Menlo, Consolas, monospace">AGENTS.md, ...</text>
    <rect x="228" y="208" width="174" height="40" rx="6" fill="#e0ecff" stroke="#1d4ed8"/>
    <text x="315" y="233" font-size="13" font-weight="bold">the entry block</text>

    <rect x="470" y="40" width="220" height="80" rx="10" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="580" y="70" font-weight="bold">The contract</text>
    <text x="580" y="92" font-size="13">18 rules, each with</text>
    <text x="580" y="108" font-size="13">how it is enforced</text>

    <rect x="470" y="290" width="220" height="90" rx="10" fill="#e3f5e8" stroke="#15803d" stroke-width="2"/>
    <text x="580" y="318" font-weight="bold" font-family="Menlo, Consolas, monospace" font-size="14">project.json</text>
    <text x="580" y="340" font-size="13">the project's checks, profiles,</text>
    <text x="580" y="358" font-size="13">authority and own rules</text>

    <rect x="740" y="40" width="200" height="80" rx="10" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="840" y="70" font-weight="bold">13 procedures</text>
    <text x="840" y="92" font-size="13">step lists, one per</text>
    <text x="840" y="108" font-size="13">kind of work</text>

    <rect x="740" y="170" width="200" height="80" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="840" y="200" font-weight="bold">13 skills</text>
    <text x="840" y="222" font-size="13">12 match the work;</text>
    <text x="840" y="238" font-size="13">interview starts by name</text>
  </g>
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <line x1="170" y1="205" x2="208" y2="205" marker-end="url(#arrow)"/>
    <path d="M402,220 C440,220 440,80 468,80" marker-end="url(#arrow)"/>
    <path d="M402,236 C440,236 440,335 468,335" marker-end="url(#arrow)"/>
    <line x1="690" y1="80" x2="738" y2="80" marker-end="url(#arrow)"/>
    <line x1="840" y1="170" x2="840" y2="122" marker-end="url(#arrow)"/>
    <path d="M95,240 L95,282 L840,282 L840,252" stroke="#7e22ce" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  </g>
  <g font-size="13" fill="#111827">
    <text x="440" y="140" text-anchor="middle">points to</text>
    <text x="714" y="72" text-anchor="middle">names</text>
    <text x="848" y="152">points back</text>
    <text x="110" y="276" fill="#7e22ce">with skills, the agent opens the right one directly</text>
    <text x="20" y="405" font-style="italic">Where the project's rules and the kit differ, the stricter applies.</text>
  </g>
</svg>
